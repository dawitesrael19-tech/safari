spring.application.name=safari
server.port=8081
server.tomcat.threads.max=50

spring.datasource.url=jdbc:postgresql://localhost:5432/mpesa
spring.datasource.username=mpesa
spring.datasource.password=mpesa
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=2000

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-stacktrace=never
server.error.include-message=never

mpesa.bank.url=http://localhost:9090
mpesa.payouts.workers=16
